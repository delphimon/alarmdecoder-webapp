name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: modern/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: modern/frontend
        run: npm ci

      - name: Build frontend
        working-directory: modern/frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests
        working-directory: modern/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -x -q

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="alarmdecoder-modern-${VERSION}.tar.gz"
          # Copy frontend dist into the modern directory for packaging
          tar -czf "${ARCHIVE}" \
            --exclude='modern/frontend/node_modules' \
            --exclude='modern/backend/.venv' \
            --exclude='modern/backend/__pycache__' \
            --exclude='**/__pycache__' \
            --exclude='**/*.pyc' \
            modern/
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          name: AlarmDecoder Modern ${{ env.VERSION }}
